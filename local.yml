- hosts: localhost
  vars:
    source_key: "./.ssh/id_ed25519"
    dest_key: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
    # Halaxy dev environment (tasks/halaxy-dev.yml)
    docker_server_root: "{{ lookup('env', 'HOME') }}/docker-server"
    halaxy_env_repos:
      - healthkit
      - api-clinical
      - api-main
      - api-file
    # Provide secrets at runtime, e.g. --extra-vars "composer_github_token=... npm_github_token=..."
    composer_github_token: ""
    npm_github_token: ""
  pre_tasks:
    - name: Update cache
      become: true
      apt:
        update_cache: true
      tags:
        - always

  tasks:
    - import_tasks: tasks/ssh.yml
    - import_tasks: tasks/core-setup.yml
    - import_tasks: tasks/node.yml
    - import_tasks: tasks/npm-packages.yml
    - import_tasks: tasks/zsh.yml
    - import_tasks: tasks/nvim-setup.yml
    - import_tasks: tasks/dotfiles.yml
    - import_tasks: tasks/productivity.yml
    - import_tasks: tasks/halaxy-dev.yml

