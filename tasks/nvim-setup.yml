- name: Get Packer
  ansible.builtin.git:
    repo: 'https://github.com/wbthomason/packer.nvim'
    dest: "{{ lookup('env', 'HOME') }}/.local/share/nvim/site/pack/packer/start/packer.nvim"
  tags:
    - packer

- name: Install PPA tooling for neovim (software-properties-common for apt_repository)
  become: true
  apt:
    name:
      - ca-certificates
      - gnupg
      - software-properties-common
    state: present
  tags:
    &tags_for_neovim_tasks [ 'neovim' ]

# Ansible's apt_repository adds the PPA without the interactive `add-apt-repository`
# tool, which is what hangs in a non-interactive script context.
- name: Add neovim ppa
  become: true
  ansible.builtin.apt_repository:
    repo: 'ppa:neovim-ppa/unstable'
    state: present
    update_cache: true
  tags:
    *tags_for_neovim_tasks

- name: Install neovim
  become: true
  apt:
    name: neovim
    state: present
  tags:
    *tags_for_neovim_tasks

- name: Neovim Plugin Development 1
  become: true
  apt:
    name: luarocks
    state: present
  tags:
    - neovim-plugin

- name: Neovim Plugin Development 2 luacheck
  become: true
  shell: luarocks install luacheck
  tags:
    - neovim-plugin

- name: Install ripgrep for telescope
  become: true
  apt:
    name: ripgrep
    state: present
  tags:
    - neovim-plugin

